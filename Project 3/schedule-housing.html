<body>
    <header> 
        <div class="heading">
            <img src="img/stones.png" alt="stonepic">
            <h1>Stepping Stone Temporary Living</h1>
        </div>
    </header>

    <section class="middle">
        <section class="content">
            <p>
                <h3>Room Application</h3>
                <form>
                    <label>Enter your information below to get a room.</label> <br>
                    <label for="name">Full Name: </label>
                    <input type="text" id="name"> <br>

                    <label for="age">Age: </label>
                    <input type="number" id="age"><br>

                    <label for="id-type">ID Type: </label>
                    <input type="text" id="id-type"><br>

                    <label for="id-num">ID Number: </label>
                    <input type="number" id="id-num"><br>

                    <label>Book for Month or Day? </label>
                    <div>
                        <input type="radio" 
                               id="Month" 
                               name="time" 
                               value="Month">
                        <label for="Month">Month</label>
                    </div>
                    <div>
                        <input type="radio" 
                               id="Day" 
                               name="time" 
                               value="Day">
                        <label for="Day">Day</label>
                    </div>

                    <label for="date">Check in Day? </label>
                    <input type="text" id="day"><br>

                    <button class="sh-button" onclick="schedule_booking()">Schedule</button>
                </form>
            </p>
